<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSH · Claude 视频滑块</title>
<style>
  :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#171716;color:#c7c6c0}
  *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:30px 20px}
  main{width:min(100%,600px)}header{display:flex;align-items:center;gap:10px;margin-bottom:38px;color:#8b8b82;font-size:11px;letter-spacing:2px}
  .mark{width:20px;height:20px;border:1px solid #6d6a60;border-radius:6px;display:grid;place-items:center;color:#ccc7b8;font-size:12px;letter-spacing:0}
  h1{font-family:Georgia,"Songti SC",SimSun,serif;font-weight:400;letter-spacing:-1px;font-size:32px;line-height:1.3;margin:0 0 10px;color:#e3dfd4}
  .intro{color:#82827a;font-size:13px;margin:0 0 38px;line-height:1.8}.stage{position:relative;padding-top:154px}
  .composer{border:1px solid #393936;border-radius:14px;background:#20201f;padding:18px 18px 8px;box-shadow:0 15px 50px #0001}
  textarea{display:block;resize:none;width:100%;height:72px;border:0;outline:0;background:none;color:#c5c4be;font:14px/1.8 inherit;font-family:inherit;font-size:14px;line-height:1.8;padding:0}
  footer{display:flex;align-items:center;gap:7px;justify-content:flex-end;margin-top:4px;font-size:13px}
  button,select{font:inherit;color:inherit;cursor:pointer}button{background:none;border:0;border-radius:5px;padding:4px 6px}button:hover,button[aria-expanded=true]{background:#31312e}button:focus-visible,select:focus-visible{outline:2px solid #ada0df;outline-offset:3px}
  select{max-width:150px;background:#20201f;border:0;padding:4px;outline:none;color:#aaa9a3;font-size:13px}.effort{color:#aaa9a3}.chevron{font-size:11px;color:#6e6e67;margin-left:6px}.maximum{color:#a49bd7}
  .popup{position:absolute;right:19px;bottom:45px;z-index:2}.popup[hidden]{display:none}.send{margin-left:3px;color:#81817a;font-size:17px}
  .caption{display:flex;justify-content:space-between;gap:16px;margin:18px 2px 0;color:#64645e;font-size:11px;line-height:1.8}.caption span:last-child{text-align:right}
  .settings{margin-top:26px;display:flex;align-items:center;gap:8px}.settings button{color:#86867c;font-size:11px;padding:5px 9px;border:1px solid #343430;border-radius:20px}.settings .hint{color:#66665f;font-size:11px;margin-left:auto}
  @media(max-width:480px){h1{font-size:28px}.caption{display:block}.caption span{display:block}.caption span:last-child{text-align:left}.settings .hint{display:none}header{margin-bottom:30px}}
</style>
<main>
  <header><span class="mark">d</span> DSH / CLAUDE SLIDER</header>
  <h1>把思考，调到刚好。</h1>
  <p class="intro">复刻视频里的细节：白色滑块、柔和吸附，以及最高档的紫色像素流。</p>
  <section class="stage" aria-label="插件交互预览">
    <div class="composer">
      <textarea aria-label="预览输入框" spellcheck="false">把这个交互做得更简单一点。
拖动滑块，选择这一次需要的思考深度。</textarea>
      <footer>
        <select id="model" aria-label="选择演示模型"><option value="video">Opus 5.5</option><option value="deepseek">DeepSeek · 三档演示</option></select>
        <button id="effort" class="effort" aria-haspopup="dialog" aria-expanded="true" aria-controls="popup"><span id="effort-name">Medium</span><span class="chevron" aria-hidden="true">⌄</span></button>
        <span class="send" aria-hidden="true">↵</span>
      </footer>
    </div>
    <div class="popup" id="popup" role="dialog" aria-label="推理等级"><dsh-claude-effort-slider id="slider"></dsh-claude-effort-slider></div>
  </section>
  <div class="caption"><span>拖动或点击 · 松开吸附 · 方向键微调</span><span>独立预览，不连接模型服务</span></div>
  <div class="settings"><button id="medium">Medium</button><button id="ultra">Ultracode ↗</button><span class="hint">最高档：像素由右向左展开</span></div>
</main>
<script src="../src/pixel-motion.js"></script>
<script src="../src/slider.js"></script>
<script>
  const slider = document.querySelector('#slider');
  const popup = document.querySelector('#popup');
  const effort = document.querySelector('#effort');
  const name = document.querySelector('#effort-name');
  const model = document.querySelector('#model');
  const sets = {
    video: ['Low', 'Medium', 'High', 'Extra', 'Max', 'Ultracode'],
    deepseek: ['Low', 'High', 'Max'],
  };
  const committed = new Map([['video', 1], ['deepseek', 1]]);
  function sync(index) {
    const labels = sets[model.value];
    name.textContent = labels[index];
    effort.classList.toggle('maximum', index === labels.length - 1);
  }
  function open(value) {
    popup.hidden = !value;
    effort.setAttribute('aria-expanded', String(value));
  }
  function choose(index) {
    slider.value = index;
    committed.set(model.value, index);
    sync(index);
    open(true);
  }
  slider.addEventListener('change', event => {
    committed.set(model.value, event.detail.index);
    sync(event.detail.index);
  });
  effort.addEventListener('click', () => open(popup.hidden));
  model.addEventListener('change', () => {
    slider.steps = sets[model.value].map(label => ({ id: label.toLowerCase(), label }));
    slider.recommended = 1;
    choose(committed.get(model.value));
  });
  document.querySelector('#medium').addEventListener('click', () => { model.value = 'video'; model.dispatchEvent(new Event('change')); choose(1); });
  document.querySelector('#ultra').addEventListener('click', () => { model.value = 'video'; model.dispatchEvent(new Event('change')); choose(5); });
  document.addEventListener('pointerdown', event => {
    if (!popup.contains(event.target) && !effort.contains(event.target) && !event.target.closest('.settings')) open(false);
  });
  document.addEventListener('keydown', event => { if (event.key === 'Escape') { open(false); effort.focus(); } });
</script>
</html>
